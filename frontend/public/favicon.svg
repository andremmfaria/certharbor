<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Certharbor favicon">
  <title>Certharbor</title>
  <desc>Simplified anchor-and-certificate-seal mark for small sizes.</desc>

  <!-- Anchor: shaft, crossbar, classic U-fluke sweep -->
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16,15 L16,26"/>
    <path d="M11,17 L21,17"/>
    <path d="M8,21 A8,8 0 0 0 24,21"/>
  </g>

  <!-- Certificate seal doubling as the anchor's ring, with a check -->
  <circle cx="16" cy="7" r="5.5" fill="#dc4b40"/>
  <path d="M13,7.3 L15.2,9.4 L19.3,4.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
