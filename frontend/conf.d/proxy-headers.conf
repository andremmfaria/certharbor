# Included by EVERY location that proxies. proxy_set_header inherits
# all-or-nothing per level, so a location defining its own subset silently
# loses the rest (D5 rule 2).
#
# The replace form, never $proxy_add_x_forwarded_for: nginx is the only hop
# the backend trusts, so the header carries exactly the address nginx vouches
# for and nothing a client wrote. X-Real-IP is set and the other two are cleared
# so no single-value header from the client reaches the backend at all, even
# if a block ever loses X-Forwarded-For (D5 rule 1).
proxy_set_header Host            $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header True-Client-IP  "";
proxy_set_header Forwarded       "";
# Overwrites any inbound value, so the id in the access log is the one the
# backend logs and echoes.
proxy_set_header X-Request-Id    $request_id;
