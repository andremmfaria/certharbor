# Stands in for the Go backend on the throwaway network, under the network
# alias step-webui. It echoes every forwarding header it received, so the
# runner can assert what nginx passed on rather than what the client sent.

events {
  worker_connections 64;
}

http {
  server_tokens off;
  access_log off;

  server {
    listen 8443 ssl;
    ssl_certificate /stub/upstream.crt;
    ssl_certificate_key /stub/upstream.key;
    default_type application/json;

    # The backend's own 503 must reach the client with its body intact.
    location = /api/v1/lint-backend-503 {
      default_type application/problem+json;
      return 503 '{"type":"https://step-ca-webui/errors/backend-own","status":503}';
    }

    # Generated by run.sh: a response whose headers exceed nginx's default
    # proxy buffer.
    include /stub/*.conf;

    location / {
      add_header X-Content-Type-Options "nosniff";
      return 200 '{"stub":"step-webui","uri":"$request_uri","host":"$http_host","xff":"$http_x_forwarded_for","xri":"$http_x_real_ip","tci":"$http_true_client_ip","fwd":"$http_forwarded","rid":"$http_x_request_id"}';
    }
  }
}
