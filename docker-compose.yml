services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_DB:            certharbor
      POSTGRES_USER:          certharbor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - step-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certharbor -d certharbor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Step-CA ───────────────────────────────────────────────────────────────
  step-ca:
    image: "${STEP_CA_IMAGE:-smallstep/step-ca:0.30.2}"
    container_name: step-ca
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - step-ca-data:/home/step
      - ./scripts/step-ca-bootstrap.sh:/usr/local/bin/step-ca-bootstrap.sh:ro
    environment:
      TZ: "${TZ:-UTC}"
      DOCKER_STEPCA_INIT_NAME:             "Home CA"
      DOCKER_STEPCA_INIT_DNS_NAMES:        "step-ca,${HOST_IP:-127.0.0.1}"
      DOCKER_STEPCA_INIT_ADDRESS:          ":9443"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: "${PROVISIONER:-admin}"
      DOCKER_STEPCA_INIT_PASSWORD_FILE:    /run/secrets/ca_password
      DOCKER_STEPCA_INIT_SSH:              "false"
      STEPCA_DEFAULT_TLS_CERT_DURATION:    "${STEPCA_DEFAULT_TLS_CERT_DURATION:-8760h}"
      STEPCA_MAX_TLS_CERT_DURATION:        "${STEPCA_MAX_TLS_CERT_DURATION:-87600h}"
    secrets:
      - ca_password
    command: ["/bin/sh", "/usr/local/bin/step-ca-bootstrap.sh", "/usr/local/bin/step-ca", "--password-file", "/home/step/secrets/password", "/home/step/config/ca.json"]
    networks:
      - step-net
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:9443/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Certharbor backend (Go) ────────────────────────────────────────────
  # No published port: certharbor-web is the one public origin, and a second
  # path straight to the backend would bypass its rate limit, its body ceiling
  # and the trusted-proxy identity. Debug with `docker compose exec`.
  certharbor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${BACKEND_IMAGE:-certharbor-backend:${IMAGE_TAG:-local}}"
    container_name: certharbor
    restart: unless-stopped
    volumes:
      - certharbor-certs:/opt/certharbor/certs
      - certharbor-ssl:/opt/certharbor/ssl
      - certharbor-web-ssl:/opt/certharbor/web-ssl
      - certharbor-data:/opt/certharbor/data
      - certharbor-uploads:/opt/certharbor/uploads
      - step-ca-data:/home/step:ro
    secrets:
      - postgres_password
      - secret_key
      - ca_password
    environment:
      TZ: "${TZ:-UTC}"
      # DATABASE_URL is constructed in entrypoint.sh from POSTGRES_PASSWORD_FILE
      # so the password never appears in `docker inspect` or /proc/<pid>/environ.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST:    postgres
      POSTGRES_PORT:    "5432"
      POSTGRES_USER:    certharbor
      POSTGRES_DB:      certharbor
      CA_URL:           "https://step-ca:9443"
      ROOT_CERT:        "/home/step/certs/root_ca.crt"
      PROVISIONER:      "${PROVISIONER:-admin}"
      PASSWORD_FILE:    "/opt/certharbor/data/provisioner_password"
      # stepca, because nginx verifies the backend's leaf against the CA root
      # and a self-signed one fails that on every request. CA_FINGERPRINT and
      # CA_ROOT_CERT_PEM matter only where step-ca-data is not mounted at
      # ROOT_CERT's parent as it is here.
      UI_TLS_MODE:      "${UI_TLS_MODE:-stepca}"
      CA_FINGERPRINT:   "${CA_FINGERPRINT:-}"
      CA_ROOT_CERT_PEM: "${CA_ROOT_CERT_PEM:-}"
      # nginx's proxy_ssl_name: the backend leaf must carry this name.
      UI_HOSTNAME:      "${UI_HOSTNAME:-certharbor}"
      UI_CERT_DURATION: "${UI_CERT_DURATION:-8760h}"
      WEB_TLS_MODE:     "${WEB_TLS_MODE:-stepca}"
      WEB_HOSTNAME:     "${WEB_HOSTNAME:-}"
      WEB_UPSTREAM_HOST: "${WEB_UPSTREAM_HOST:-certharbor-web}"
      PROVISIONER_PASSWORD_FILE: /run/secrets/ca_password
      SECRET_KEY_FILE:  /run/secrets/secret_key
      SESSION_SECURE:   "${SESSION_SECURE:-true}"
      # Setting these in .env alone is a silent no-op: they only reach the
      # container from here. A malformed TRUSTED_PROXY_CIDRS is a startup
      # fatal. An empty one trusts whatever WEB_UPSTREAM_HOST resolves to.
      TRUST_PROXY:         "${TRUST_PROXY:-true}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      # Both name nginx's published origin and never a path under /app/:
      # reset links are emailed and the redirect URI is registered with the IdP.
      PUBLIC_BASE_URL:    "${PUBLIC_BASE_URL:-}"
      OIDC_REDIRECT_URL:  "${OIDC_REDIRECT_URL:-}"
      OIDC_ENABLED:       "${OIDC_ENABLED:-false}"
      OIDC_ISSUER_URL:    "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID:     "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_GROUP_CLAIM:   "${OIDC_GROUP_CLAIM:-groups}"
      OIDC_GROUP_ADMIN:   "${OIDC_GROUP_ADMIN:-}"
      OIDC_GROUP_MANAGER: "${OIDC_GROUP_MANAGER:-}"
      OIDC_GROUP_VIEWER:  "${OIDC_GROUP_VIEWER:-}"
      OIDC_DEFAULT_ROLE:  "${OIDC_DEFAULT_ROLE:-}"
      OIDC_SYNC_ROLE:     "${OIDC_SYNC_ROLE:-true}"
      LOCAL_LOGIN_ENABLED: "${LOCAL_LOGIN_ENABLED:-true}"
      STEP_CA_IMAGE:    "${STEP_CA_IMAGE:-smallstep/step-ca:0.30.2}"
      HOST_IP:          "${HOST_IP:-127.0.0.1}"
      PORT:             "8443"
      CERTHARBOR_ADMIN_PASSWORD: "${CERTHARBOR_ADMIN_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
      step-ca:
        condition: service_healthy
    networks:
      - step-net
    healthcheck:
      # /health is liveness only. The marker means the backend fell back to a
      # self-signed leaf nginx cannot verify, so depends_on must hold nginx off.
      test: ["CMD-SHELL", "curl -fsk --max-time 3 -o /dev/null https://localhost:8443/health && test ! -e /opt/certharbor/ssl/.fallback"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Certharbor origin (nginx) ─────────────────────────────────────────
  # Terminates TLS for WEB_HOSTNAME, serves the SPA and proxies the backend.
  # Its healthcheck is the image's own.
  certharbor-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: "${WEB_IMAGE:-certharbor-web:${IMAGE_TAG:-local}}"
    container_name: certharbor-web
    restart: unless-stopped
    init: true
    environment:
      TZ: "${TZ:-UTC}"
      WEB_TLS_MODE:        "${WEB_TLS_MODE:-stepca}"
      WEB_HOSTNAME:        "${WEB_HOSTNAME:-}"
      WEB_HSTS_MAX_AGE:    "${WEB_HSTS_MAX_AGE:-}"
      WEB_RESOLVER:        "${WEB_RESOLVER:-127.0.0.11}"
      WEB_RELOAD_INTERVAL: "${WEB_RELOAD_INTERVAL:-60}"
      WEB_RATE_LIMIT:      "${WEB_RATE_LIMIT:-20r/s}"
      WEB_RATE_BURST:      "${WEB_RATE_BURST:-40}"
    # The only certificate-bearing mount. certharbor-ssl holds the backend's
    # private key and step-ca-data the CA's, and neither is mounted here.
    volumes:
      - certharbor-web-ssl:/etc/certharbor/ssl:ro
    ports:
      - "${UI_HTTPS_PORT:-443}:8443"
    depends_on:
      certharbor:
        condition: service_healthy
    networks:
      - step-net

# ─── Secrets ───────────────────────────────────────────────────────────────
# Each secret is a host file mounted read-only at /run/secrets/<name>.
# Values do NOT appear in `docker inspect` environment or /proc/<pid>/environ.
# Create them once with: make setup
# Or manually:
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' 'strong-pg-pass'  > secrets/postgres_password && chmod 600 secrets/postgres_password
#   printf '%s' 'strong-ca-pass'  > secrets/ca_password       && chmod 600 secrets/ca_password
#   printf '%s' 'strong-48char-key' > secrets/secret_key      && chmod 600 secrets/secret_key
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  secret_key:
    file: ./secrets/secret_key
  ca_password:
    file: ./secrets/ca_password

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  step-ca-data:
  certharbor-certs:
  certharbor-ssl:
  certharbor-web-ssl:
  certharbor-data:
  certharbor-uploads:

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  step-net:
    driver: bridge
    name: step-network
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    # No service carries a static address: the backend trusts nginx by
    # resolving its name. The subnet is pinned only so a collision with a LAN
    # or VPN route is one key to change, which needs
    # `docker compose down && docker network rm step-network` on a live stack.
    ipam:
      config:
        - subnet: "${STEP_NET_SUBNET:-10.213.0.0/24}"
