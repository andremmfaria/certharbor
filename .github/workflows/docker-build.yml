name: Build and Publish Container Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build / Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/certharbor/certharbor-control
            scope: e2e-backend
          - name: frontend
            context: .
            file: ./frontend/Dockerfile
            image: ghcr.io/certharbor/certharbor-console
            scope: e2e-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ci.yml's `client` job is the one publish mechanism for
      # @kantharos-ai/certharbor-client, on the same v* tag push but in a
      # separate workflow with no cross-workflow `needs:`. These two steps
      # (frontend leg, tag pushes only) compute the exact version that job
      # will have published and poll the registry for it before the Docker
      # build runs, so this build never races that publish.
      - name: Compute the client version
        id: client-version
        if: matrix.name == 'frontend' && startsWith(github.ref, 'refs/tags/v')
        run: echo "version=$(./scripts/client-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Wait for the published client package
        if: matrix.name == 'frontend' && startsWith(github.ref, 'refs/tags/v')
        env:
          CLIENT_VERSION: ${{ steps.client-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" > ~/.npmrc
          for i in $(seq 1 30); do
            if npm view "@kantharos-ai/certharbor-client@${CLIENT_VERSION}" version \
                 --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "found @kantharos-ai/certharbor-client@${CLIENT_VERSION} after $(( (i - 1) * 10 ))s"
              exit 0
            fi
            echo "not yet published (attempt $i/30), waiting 10s..."
            sleep 10
          done
          echo "::error::@kantharos-ai/certharbor-client@${CLIENT_VERSION} did not appear on the registry within 5 minutes"
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          build-args: |
            CLIENT_SOURCE=${{ (matrix.name == 'frontend' && startsWith(github.ref, 'refs/tags/v')) && 'registry' || 'local' }}
            CLIENT_VERSION=${{ (matrix.name == 'frontend' && startsWith(github.ref, 'refs/tags/v')) && steps.client-version.outputs.version || '' }}
          secrets: |
            npm_token=${{ (matrix.name == 'frontend' && startsWith(github.ref, 'refs/tags/v')) && secrets.GITHUB_TOKEN || '' }}
