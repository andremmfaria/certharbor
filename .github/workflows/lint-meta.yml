name: Meta Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile lint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [backend/Dockerfile, frontend/Dockerfile]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go (for actionlint)
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .github/
          config_file: .github/.yamllint.yml

  style:
    name: Frontend style (stylelint / eslint / djlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install frontend linters
        run: |
          npm install --no-save stylelint@^16 stylelint-config-standard@^37 eslint@^9
          pip install --quiet djlint==1.44.1

      - name: stylelint (frontend CSS)
        run: |
          node_modules/.bin/stylelint \
            --config backend/.stylelintrc.json \
            --config-basedir "$(pwd)" \
            "frontend/src/styles/**/*.css"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: frontend lint (eslint + prettier)
        run: make frontend-lint

      - name: Build and pack the TS client (in-image approach, see test/e2e/Dockerfile)
        run: |
          npm ci
          npm run generate && npm run build
          npm version "$(tr -d '[:space:]' < ../../VERSION)-dev" --no-git-tag-version --allow-same-version
          npm pack --pack-destination dist
          mv dist/kantharos-ai-certharbor-client-*.tgz dist/client.tgz
        working-directory: clients/ts

      - name: Install the e2e harness
        run: |
          npm ci
          npm install --no-save ../../clients/ts/dist/client.tgz
        working-directory: test/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: tsc (e2e harness)
        run: npx tsc --noEmit
        working-directory: test/e2e

      - name: eslint (e2e harness)
        run: npx eslint .
        working-directory: test/e2e

  version:
    name: Versions follow VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Every version matches the VERSION file
        run: ./scripts/sync-version.sh --check
