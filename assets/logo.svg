<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Certharbor logo">
  <title>Certharbor</title>
  <desc>A maritime anchor whose top ring is a certificate seal with a verification checkmark — fusing the "harbor" and "certificate" halves of the project into one mark.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f3486"/>
      <stop offset="1" stop-color="#000b24"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="18" x2="0" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7d6f5"/>
      <stop offset="0.5" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#1b4fb0"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8675c"/>
      <stop offset="1" stop-color="#dc4b40"/>
    </linearGradient>
  </defs>

  <!-- UI app tile: this is a web interface -->
  <rect x="0" y="0" width="160" height="160" rx="34" fill="url(#tile)"/>
  <!-- title-bar dots: a browser/app window -->
  <circle cx="26" cy="24" r="3.5" fill="#dc4b40" opacity="0.9"/>
  <circle cx="38" cy="24" r="3.5" fill="#f7c26d" opacity="0.85"/>
  <circle cx="50" cy="24" r="3.5" fill="#5479cb" opacity="0.85"/>

  <!-- Anchor: shaft, crossbar and the classic U-fluke sweep -->
  <g fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,60 L80,146"/>
    <path d="M58,76 L102,76"/>
    <path d="M34,100 A46,46 0 0 0 126,100"/>
  </g>

  <!-- Certificate seal doubling as the anchor's ring, with a verification check -->
  <g transform="translate(80,40)">
    <circle r="21" fill="url(#seal)"/>
    <circle r="21" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M -8.5 1 L -2 8 L 10 -7.5" fill="none" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
