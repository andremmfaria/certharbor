# Makes CA_FINGERPRINT reachable: the stock stack mounts step-ca-data read-only
# at ROOT_CERT's parent, so ensureRootCert early-returns and the fingerprint is
# never read, and a fetch would hit EROFS anyway.
#
# !override replaces the base volume list instead of merging with it; a plain
# `volumes:` key would leave the read-only mount in place.
#
# Removing /home/step also disables checkProvisionerPasswordSync and drops the
# step-ca-data component from the backup bundle, so E2E-HLTH-06 and E2E-BAK-01
# must not run against this stack (Section 2.7.1).
services:
  certharbor:
    volumes: !override
      - certharbor-certs:/opt/certharbor/certs
      - certharbor-ssl:/opt/certharbor/ssl
      - certharbor-data:/opt/certharbor/data
      - certharbor-uploads:/opt/certharbor/uploads
    environment:
      ROOT_CERT: /opt/certharbor/data/root_ca.crt
